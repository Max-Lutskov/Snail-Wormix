<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <!-- Castle map, solid layer. Opaque = solid, transparent = air. Garden world (A), see docs/art/ART_SPEC.md. -->
  <defs>
    <pattern id="soil" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#3B2618"/>
      <g fill="#48301F"><circle cx="14" cy="14" r="7"/><circle cx="54" cy="30" r="9"/><circle cx="28" cy="60" r="8"/><circle cx="68" cy="68" r="5"/></g>
      <g fill="#6E5848"><ellipse cx="40" cy="10" rx="4" ry="3"/><ellipse cx="16" cy="38" rx="3.2" ry="2.3"/><ellipse cx="62" cy="52" rx="5" ry="3.6"/><ellipse cx="8" cy="70" rx="2.6" ry="2"/></g>
      <path d="M20,22 q8,6 4,14 t6,12" stroke="#7A5A3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g fill="#24160D"><circle cx="34" cy="28" r="1.4"/><circle cx="70" cy="14" r="1.2"/><circle cx="10" cy="52" r="1.3"/></g>
    </pattern>
    <pattern id="brick" width="32" height="28" patternUnits="userSpaceOnUse">
      <rect width="32" height="28" fill="#C8643B"/>
      <rect x="1" y="1" width="14" height="12" fill="#D2704A"/>
      <rect x="17" y="15" width="14" height="12" fill="#BD5A33"/>
      <path d="M0,0 H32 M0,14 H32 M0,0 V14 M16,14 V28" stroke="#8E3F22" stroke-width="2.4"/>
      <path d="M2,3 H12 M18,17 H28" stroke="#E08A5C" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <pattern id="pot" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#CC6A3F"/>
      <path d="M0,22 H40" stroke="#A84E2C" stroke-width="3"/>
      <path d="M0,2 H40" stroke="#E08A5C" stroke-width="1.5"/>
      <circle cx="12" cy="11" r="1.2" fill="#A84E2C"/><circle cx="31" cy="15" r="1" fill="#A84E2C"/>
    </pattern>
    <linearGradient id="potShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B1A0E" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#3B1A0E" stop-opacity="0"/>
      <stop offset=".7" stop-color="#3B1A0E" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3B1A0E" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="720">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <path id="ground" d="M0,720 L0,640 C14,610 10,580 30,560 C44,546 40,520 60,500 C80,482 120,474 160,470 L380,470 C430,470 450,420 500,404 C540,392 570,400 600,430 C640,470 660,540 720,556 C780,570 820,520 860,480 C900,446 940,436 980,434 L1470,434 C1500,434 1530,450 1550,480 C1570,510 1560,540 1580,570 C1594,592 1588,620 1600,640 L1600,720 Z"/>
    <path id="surface" d="M0,640 C14,610 10,580 30,560 C44,546 40,520 60,500 C80,482 120,474 160,470 L380,470 C430,470 450,420 500,404 C540,392 570,400 600,430 C640,470 660,540 720,556 C780,570 820,520 860,480 C900,446 940,436 980,434 L1470,434 C1500,434 1530,450 1550,480 C1570,510 1560,540 1580,570 C1594,592 1588,620 1600,640"/>
    <clipPath id="groundClip"><use href="#ground"/></clipPath>
    <!-- Castle wall between the towers: merlons on the left part, a flat walk (spawn) on the right, gate arch. -->
    <path id="wall" fill-rule="evenodd" d="M1076,436 L1076,330 L1096,330 L1096,312 L1116,312 L1116,330 L1132,330 L1132,312 L1152,312 L1152,330 L1168,330 L1168,312 L1188,312 L1188,330 L1204,330 L1204,312 L1224,312 L1224,330 L1240,330 L1240,312 L1260,312 L1260,330 L1384,330 L1384,436 Z M1150,436 L1150,398 A35,35 0 0 1 1220,398 L1220,436 Z"/>
    <path id="towerL" fill-rule="evenodd" d="M1008,440 L996,216 L990,216 L990,190 L1100,190 L1100,216 L1094,216 L1082,440 Z M1034,300 L1034,272 A12,12 0 0 1 1058,272 L1058,300 Z"/>
    <path id="towerR" fill-rule="evenodd" d="M1376,440 L1366,226 L1360,226 L1360,200 L1470,200 L1470,226 L1464,226 L1454,440 Z M1404,312 L1404,284 A12,12 0 0 1 1428,284 L1428,312 Z"/>
    <clipPath id="wallClip"><use href="#wall"/></clipPath>
  </defs>

  <!-- Hill -->
  <use href="#ground" fill="url(#soil)"/>
  <use href="#ground" fill="url(#depth)"/>
  <g clip-path="url(#groundClip)" fill="none">
    <use href="#surface" stroke="#2F6B22" stroke-width="44"/>
    <use href="#surface" stroke="#5DAA3A" stroke-width="34"/>
    <use href="#surface" stroke="#8ED15A" stroke-width="8"/>
  </g>
  <use href="#surface" fill="none" stroke="#6FC046" stroke-width="12" stroke-dasharray="0 17" stroke-linecap="round"/>

  <!-- Wall -->
  <use href="#wall" fill="url(#brick)"/>
  <g clip-path="url(#wallClip)">
    <rect x="1086" y="300" width="290" height="140" fill="url(#potShade)" opacity=".5"/>
    <path d="M1100,360 c10,-8 18,0 14,10 c-4,10 8,16 16,10 M1300,346 c8,-6 16,2 12,10 c-4,8 6,14 14,8" stroke="#3E7A28" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#5DAA3A"><ellipse cx="1108" cy="356" rx="6" ry="4" transform="rotate(-30 1108 356)"/><ellipse cx="1124" cy="376" rx="6" ry="4" transform="rotate(20 1124 376)"/><ellipse cx="1310" cy="344" rx="6" ry="4" transform="rotate(-20 1310 344)"/><ellipse cx="1324" cy="362" rx="6" ry="4" transform="rotate(25 1324 362)"/></g>
    <path d="M1150,436 L1150,398 A35,35 0 0 1 1220,398 L1220,436" stroke="#8E3F22" stroke-width="10" fill="none"/>
  </g>
  <path d="M1262,333 H1370" stroke="#8ED15A" stroke-width="5" stroke-linecap="round"/>

  <!-- Towers: upside-up clay flowerpots -->
  <use href="#towerL" fill="url(#pot)"/>
  <path d="M1008,440 L996,216 L1094,216 L1082,440 Z" fill="url(#potShade)"/>
  <rect x="990" y="190" width="110" height="26" fill="#D97A4E"/>
  <path d="M990,192 H1100" stroke="#EFA27A" stroke-width="3"/>
  <path d="M990,214 H1100" stroke="#A84E2C" stroke-width="3"/>
  <path d="M1034,300 L1034,272 A12,12 0 0 1 1058,272 L1058,300" stroke="#8E3F22" stroke-width="4" fill="none"/>

  <use href="#towerR" fill="url(#pot)"/>
  <path d="M1376,440 L1366,226 L1464,226 L1454,440 Z" fill="url(#potShade)"/>
  <rect x="1360" y="200" width="110" height="26" fill="#D97A4E"/>
  <path d="M1360,202 H1470" stroke="#EFA27A" stroke-width="3"/>
  <path d="M1360,224 H1470" stroke="#A84E2C" stroke-width="3"/>
  <path d="M1404,312 L1404,284 A12,12 0 0 1 1428,284 L1428,312" stroke="#8E3F22" stroke-width="4" fill="none"/>

  <!-- Moss and sprouts growing out of the pots -->
  <path d="M994,190 H1096" stroke="#5DAA3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M994,186 H1096" stroke="#6FC046" stroke-width="10" stroke-dasharray="0 15" stroke-linecap="round"/>
  <path d="M1364,200 H1466" stroke="#5DAA3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M1364,196 H1466" stroke="#6FC046" stroke-width="10" stroke-dasharray="0 15" stroke-linecap="round"/>
  <g stroke="#2B1B12" stroke-width="2" stroke-linejoin="round">
    <path d="M1045,186 C1040,170 1044,160 1048,156 C1052,162 1052,174 1049,186 Z" fill="#3E7A28"/>
    <path d="M1047,174 C1030,160 1018,164 1012,170 C1024,176 1036,178 1047,176 Z" fill="#6FC046"/>
    <path d="M1049,170 C1064,156 1078,158 1084,164 C1072,172 1060,174 1049,172 Z" fill="#5DAA3A"/>
    <path d="M1415,196 C1411,182 1414,172 1418,168 C1422,174 1422,186 1419,196 Z" fill="#3E7A28"/>
    <path d="M1417,184 C1402,172 1390,176 1384,182 C1396,188 1408,188 1417,186 Z" fill="#6FC046"/>
    <circle cx="1440" cy="190" r="5" fill="#E2453C"/>
  </g>

  <!-- Surface decor (solid, inside the moss) -->
  <g stroke="#2B1B12" stroke-width="1.6">
    <g transform="translate(212,464) scale(1.3)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
    <g transform="translate(232,466) scale(.8)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/></g>
    <g transform="translate(520,399) scale(1.1)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
    <g transform="translate(724,552)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
  </g>
  <g fill="#DDF7FF" stroke="#7CC3D2" stroke-width="1.5"><circle cx="440" cy="434" r="4"/><circle cx="820" cy="520" r="3.5"/><circle cx="1510" cy="448" r="3.5"/></g>
</svg>
