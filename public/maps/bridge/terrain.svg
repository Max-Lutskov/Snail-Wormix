<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <!-- Bridge map, solid layer. Opaque = solid, transparent = air. Garden world (A), see docs/art/ART_SPEC.md. -->
  <defs>
    <pattern id="soil" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#3B2618"/>
      <g fill="#48301F"><circle cx="14" cy="14" r="7"/><circle cx="54" cy="30" r="9"/><circle cx="28" cy="60" r="8"/><circle cx="68" cy="68" r="5"/></g>
      <g fill="#6E5848"><ellipse cx="40" cy="10" rx="4" ry="3"/><ellipse cx="16" cy="38" rx="3.2" ry="2.3"/><ellipse cx="62" cy="52" rx="5" ry="3.6"/><ellipse cx="8" cy="70" rx="2.6" ry="2"/></g>
      <path d="M20,22 q8,6 4,14 t6,12" stroke="#7A5A3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g fill="#24160D"><circle cx="34" cy="28" r="1.4"/><circle cx="70" cy="14" r="1.2"/><circle cx="10" cy="52" r="1.3"/></g>
    </pattern>
    <pattern id="wood" width="60" height="16" patternUnits="userSpaceOnUse">
      <rect width="60" height="16" fill="#A8743F"/>
      <path d="M0,5 C15,3 30,7 60,5 M0,11 C20,13 40,9 60,11" stroke="#8A5A2E" stroke-width="1.2" fill="none"/>
      <ellipse cx="38" cy="8" rx="3" ry="1.6" fill="#7A5230"/>
    </pattern>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="720">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <!-- Left cliff, right cliff, rock island in the middle -->
    <path id="ground" d="M0,720 L0,600 C10,560 0,520 20,480 C34,452 70,430 120,424 L380,424 C430,424 470,430 500,446 C520,458 516,480 530,500 C548,528 520,560 540,600 C556,632 540,670 560,720 Z
      M1600,720 L1600,600 C1590,560 1600,520 1580,480 C1566,452 1530,426 1480,420 L1220,420 C1170,420 1130,428 1100,444 C1080,456 1084,480 1070,500 C1052,528 1080,560 1060,600 C1044,632 1060,670 1040,720 Z
      M720,720 C724,660 700,610 730,570 C750,546 790,536 820,540 C860,546 880,570 876,610 C872,660 890,690 884,720 Z"/>
    <path id="surface" d="M0,600 C10,560 0,520 20,480 C34,452 70,430 120,424 L380,424 C430,424 470,430 500,446
      M1600,600 C1590,560 1600,520 1580,480 C1566,452 1530,426 1480,420 L1220,420 C1170,420 1130,428 1100,444
      M730,570 C750,546 790,536 820,540 C860,546 880,570 876,610"/>
    <clipPath id="groundClip"><use href="#ground"/></clipPath>
    <!-- Sagging deck: x(t) is linear from 496 to 1104, lowest point ~ (800, 486) -->
    <path id="deck" d="M496,446 Q800,526 1104,444"/>
  </defs>

  <!-- Cliffs and island -->
  <use href="#ground" fill="url(#soil)"/>
  <use href="#ground" fill="url(#depth)"/>
  <g clip-path="url(#groundClip)" fill="none">
    <use href="#surface" stroke="#2F6B22" stroke-width="44"/>
    <use href="#surface" stroke="#5DAA3A" stroke-width="34"/>
    <use href="#surface" stroke="#8ED15A" stroke-width="8"/>
    <!-- Rocky cliff faces: a few embedded stones that read well when cut -->
    <g fill="#6E5848" stroke="#2B1B12" stroke-width="1.5"><ellipse cx="512" cy="520" rx="12" ry="8"/><ellipse cx="526" cy="610" rx="10" ry="7"/><ellipse cx="1080" cy="530" rx="12" ry="8"/><ellipse cx="1064" cy="640" rx="10" ry="7"/><ellipse cx="740" cy="640" rx="11" ry="7"/><ellipse cx="866" cy="600" rx="9" ry="6"/></g>
  </g>
  <use href="#surface" fill="none" stroke="#6FC046" stroke-width="12" stroke-dasharray="0 17" stroke-linecap="round"/>

  <!-- Struts and post from the island up to the deck -->
  <g stroke="#2B1B12" stroke-width="2" stroke-linejoin="round">
    <path d="M790,548 L790,484 L810,484 L810,548 Z" fill="url(#wood)"/>
    <path d="M752,548 L694,486 L706,476 L766,540 Z" fill="url(#wood)"/>
    <path d="M848,548 L906,486 L894,476 L834,540 Z" fill="url(#wood)"/>
  </g>
  <!-- Bridge posts on the cliffs -->
  <g stroke="#2B1B12" stroke-width="2">
    <rect x="504" y="398" width="14" height="56" rx="3" fill="url(#wood)"/>
    <rect x="1082" y="396" width="14" height="56" rx="3" fill="url(#wood)"/>
    <ellipse cx="511" cy="398" rx="9" ry="4" fill="#C4925C"/>
    <ellipse cx="1089" cy="396" rx="9" ry="4" fill="#C4925C"/>
  </g>

  <!-- Deck: 16 px thick planks with dark seams (seams are opaque, so the deck stays solid) -->
  <use href="#deck" fill="none" stroke="#2B1B12" stroke-width="20"/>
  <use href="#deck" fill="none" stroke="#A8743F" stroke-width="15"/>
  <use href="#deck" fill="none" stroke="#C4925C" stroke-width="4" transform="translate(0,-4)"/>
  <use href="#deck" fill="none" stroke="#6B4524" stroke-width="15" stroke-dasharray="2.5 28"/>
  <!-- Vine wrapped around the deck -->
  <path d="M560,460 q6,-10 12,0 q6,10 12,0 M700,488 q6,-10 12,0 q6,10 12,0 M890,488 q6,-10 12,0 q6,10 12,0 M1020,462 q6,-10 12,0 q6,10 12,0" stroke="#3E7A28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g fill="#5DAA3A" stroke="#2B1B12" stroke-width="1.2"><ellipse cx="584" cy="456" rx="6" ry="3.5" transform="rotate(-20 584 456)"/><ellipse cx="724" cy="484" rx="6" ry="3.5" transform="rotate(15 724 484)"/><ellipse cx="914" cy="484" rx="6" ry="3.5" transform="rotate(-15 914 484)"/><ellipse cx="1044" cy="458" rx="6" ry="3.5" transform="rotate(20 1044 458)"/></g>

  <!-- Surface decor (solid) -->
  <g stroke="#2B1B12" stroke-width="1.6">
    <g transform="translate(180,418) scale(1.35)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
    <g transform="translate(201,420) scale(.8)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/></g>
    <g transform="translate(846,538) scale(1.1)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
    <g transform="translate(1440,416) scale(1.2)"><rect x="-3" y="-14" width="6" height="15" rx="2" fill="#F4EBDD" stroke="none"/><path d="M-12,-12 C-12,-27 12,-27 12,-12 Z" fill="#E2453C"/><circle cx="-5" cy="-18" r="2" fill="#fff" stroke="none"/><circle cx="4" cy="-20" r="2.4" fill="#fff" stroke="none"/></g>
  </g>
  <g fill="#DDF7FF" stroke="#7CC3D2" stroke-width="1.5"><circle cx="420" cy="424" r="4"/><circle cx="1180" cy="422" r="3.5"/><circle cx="760" cy="552" r="3.5"/></g>
</svg>
